# Laboratório local da atividade 28. Broker e banco não publicam portas.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a1
      POSTGRES_USER: a1
      POSTGRES_PASSWORD: ${VER1_DB_PASSWORD:-ver1-local}
    volumes:
    - lab-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U a1 -d a1
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: Qy0ysubDRN2sUKS2fPMXLw
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null
        2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /opt/kafka/bin/kafka-topics.sh
    command:
    - --bootstrap-server
    - kafka:9092
    - --create
    - --if-not-exists
    - --topic
    - ods.industria.defeito_classificado
    - --partitions
    - '1'
    - --replication-factor
    - '1'
  backend:
    build:
      context: ..
      target: backend
    environment:
      DATABASE_URL: postgresql://a1:${VER1_DB_PASSWORD:-ver1-local}@db:5432/a1
      KAFKA_BROKER_URL: kafka:9092
      KAFKA_TOPIC: ods.industria.defeito_classificado
      KAFKA_GROUP_ID: ${VER1_GROUP_ID:-ver1-sprint3-a1}
      S4_ENABLED: '0'
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',
        timeout=2))['status']=='ONLINE'
      interval: 5s
      timeout: 3s
      retries: 30
    image: ver1-composicao-backend:local
  i8-publisher:
    build:
      context: ./.dependencias/i8
      dockerfile: validacao-local/Dockerfile.publisher
    image: ver1-composicao-i8:local
    user: ${VER1_UID:-1000}:${VER1_GID:-1000}
    environment:
      KAFKA_BROKER_URL: kafka:9092
      KAFKA_TOPIC: ods.industria.defeito_classificado
    volumes:
    - ./evidencias:/evidencias:ro
    - ../shared/artifacts/defect-taxonomy:/taxonomies:ro
    command:
    - python
    - -m
    - scripts.publish_events
    - --input
    - /evidencias/eventos.jsonl
    - --taxonomy
    - /taxonomies/defects-a1-1.0.0/content.json
    - --taxonomy-descriptor
    - /taxonomies/defects-a1-1.0.0/descriptor.json
    - --taxonomy-version
    - defects-a1-1.0.0
    depends_on:
      backend:
        condition: service_healthy
    profiles:
    - ferramentas
  prova:
    image: ver1-composicao-backend:local
    user: ${VER1_UID:-1000}:${VER1_GID:-1000}
    environment:
      DATABASE_URL: postgresql://a1:${VER1_DB_PASSWORD:-ver1-local}@db:5432/a1
      KAFKA_BROKER_URL: kafka:9092
      KAFKA_TOPIC: ods.industria.defeito_classificado
      KAFKA_GROUP_ID: ${VER1_GROUP_ID:-ver1-sprint3-a1}
      API_URL: http://frontend/api/v1
      A1_SHA: ${VER1_A1_SHA:-unknown}
      I8_SHA: 55a808b1351fdd94ea039148b49fba1f478603e1
      FRONTEND_URL: http://frontend/frontend/
      A1_DIRTY: ${VER1_A1_DIRTY:-unknown}
    volumes:
    - ..:/repos/a1:ro
    - ./.dependencias/i8:/repos/i8:ro
    - ./evidencias:/evidencias
    - ./provar.py:/lab/provar.py:ro
    entrypoint:
    - python
    - /lab/provar.py
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
    - ferramentas
  frontend:
    build:
      context: ..
      target: frontend
    image: ver1-composicao-frontend:local
    environment:
      A1_API_BASE: /api/v1
    ports:
    - 127.0.0.1:${VER1_PORT:-5501}:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1/frontend/
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  lab-db: {}
