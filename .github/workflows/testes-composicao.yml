name: Sprint 3 - composição local VER-1
on:
  pull_request:
    paths:
      - 'composicao-ver1/**'
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'docker/**'
      - 'validacao-local/provar_fluxo.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - '.github/workflows/testes-composicao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composicao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercitar composição em Docker e encerrá-la
        run: bash composicao-ver1/executar.sh testar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-composicao-ver1
          path: composicao-ver1/evidencias/
          retention-days: 30
      - name: Garantir encerramento também após cancelamento
        if: always()
        run: bash composicao-ver1/executar.sh parar
