name: Sprint 3 - fechamento reproduzível
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fechamento-sprint3/**'
      - 'composicao-ver1/**'
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'tests/**'
      - 'validacao-local/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'requirements*.txt'
      - 'scripts/capture_sprint3_closure.mjs'
      - 'scripts/build_closure_manifest.py'
      - 'scripts/verify_closure_evidence.py'
      - 'docs/evidencias/atividade-31/**'
      - '.github/workflows/fechamento-sprint3.yml'
permissions:
  contents: read
jobs:
  regressao:
    name: Atividade 29 - regressão completa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executar contratos, banco, Kafka, frontend e reinício
        run: bash fechamento-sprint3/regressao.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atividade-29-regressao-${{ github.sha }}
          path: |
            fechamento-sprint3/evidencias/atividade-29/
            composicao-ver1/evidencias/
          retention-days: 30
      - name: Garantir encerramento dos laboratórios
        if: always()
        run: |
          docker compose -p ver1-sprint3-regressao -f validacao-local/compose-s5-p7.yml down -v --remove-orphans
          bash composicao-ver1/executar.sh parar
  metricas:
    name: Atividade 30 - latência e recursos
    needs: regressao
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Medir pipeline, API, memória e ambiente
        run: bash fechamento-sprint3/medir.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atividade-30-metricas-${{ github.sha }}
          path: |
            fechamento-sprint3/evidencias/atividade-30/
            composicao-ver1/evidencias/
          retention-days: 30
      - name: Garantir encerramento do laboratório
        if: always()
        run: bash composicao-ver1/executar.sh parar
  evidencias:
    name: Atividade 31 - vídeo e evidências
    needs: metricas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Garantir ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 60s apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          google-chrome --version
          node --version
      - name: Repetir captura visual
        run: node scripts/capture_sprint3_closure.mjs "$(command -v google-chrome)" "$(command -v ffmpeg)" "$RUNNER_TEMP/atividade-31"
      - name: Verificar evidências versionadas
        run: python scripts/verify_closure_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: atividade-31-evidencias-${{ github.sha }}
          path: ${{ runner.temp }}/atividade-31/
          retention-days: 30
