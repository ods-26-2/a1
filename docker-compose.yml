services:
  # Interface de inspeção em http://localhost:5500/frontend/
  # (no servidor, A1_PORT=127.0.0.1:5500 e o acesso público passa pelo caddy)
  frontend:
    build:
      context: .
      target: frontend
    environment:
      # Base da API usada pela tela; "fake" volta para a API fake
      A1_API_BASE: ${A1_API_BASE:-/api/v1}
    ports:
      - "${A1_PORT:-5500}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # API v1 do A1 (S3-07), acessada pelo frontend em /api/. A porta 8000 só
  # abre em 127.0.0.1, para desenvolvimento
  backend:
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: postgresql://a1:${POSTGRES_PASSWORD:-a1-local}@db:5432/a1
    ports:
      - "127.0.0.1:${A1_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL do backend A1 (S3-07). Sem porta publicada: só os serviços
  # do compose acessam. No servidor, POSTGRES_PASSWORD vem do arquivo .env
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a1
      POSTGRES_USER: a1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a1-local}
    volumes:
      - a1-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a1 -d a1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HTTPS no servidor (profile https): o Caddy emite o certificado para
  # A1_DOMAIN e repassa as requisições para o frontend
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      A1_DOMAIN: ${A1_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Validação dos contratos 6c, pytest e testes do frontend:
  #   docker compose run --rm tests
  # Os testes de banco usam schemas temporários no mesmo PostgreSQL
  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]
    environment:
      A1_TEST_DATABASE_URL: postgresql://a1:${POSTGRES_PASSWORD:-a1-local}@db:5432/a1
    depends_on:
      db:
        condition: service_healthy

volumes:
  a1-db-data:
  caddy-data:
  caddy-config:
